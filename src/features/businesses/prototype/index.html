      <p class="intro">
        <b>THROWAWAY · ISSUE #82</b><br />Which layout makes twelve deep businesses feel manageable?
        Five interactive tabs. Compact Wealth, market orders and property management use sample
        data. Figures are illustrative; no engine or save writes.
      </p>
      <div class="tools">
        <select id="scenario" aria-label="Sample scenario">
          <option value="operating">Operating empire</option>
          <option value="first">First session</option>
          <option value="attention">Needs attention</option>
          <option value="diversified">Diversified holdings</option></select
        ><button data-action="reset">Reset sample</button>
        <select id="palette" aria-label="Color palette">
          <option value="graphite">Graphite · mint</option>
          <option value="midnight">Midnight · blue</option>
          <option value="ash">Ash · ivory</option>
        </select>
        <select id="business-art" aria-label="Business row artwork">
          <option value="illustrated">Two-tone illustrations</option>
          <option value="outline">Outline icons</option>
          <option value="none">No icons</option>
        </select>
      </div>
      <div class="phone" id="phone"></div>
      <div class="evidence">
        <p id="hypothesis"></p>
        <details>
          <summary>Live prototype state · inspect after any action</summary>
          <pre id="state"></pre>
        </details>
      </div>
      <div class="switcher">
        <button data-action="prev" aria-label="Previous variant">←</button
        ><strong id="variant-label"></strong
        ><button data-action="next" aria-label="Next variant">→</button>
      </div>
    </main>
    <script>
      const variants = ['A', 'B', 'C'];
      const names = { A: 'The Ledger', B: 'Command Center', C: 'Empire Journey' };
      const hypotheses = {
        A: 'A · Selected direction: business net worth replaces decorative headings. Compare two-tone illustrations, outline icons and text-only rows with the artwork selector.',
        B: 'B · Command Center: lead with the business scene and its next operational action. Tests whether a clear priority makes deep mechanics approachable.',
        C: 'C · Empire Journey: lead with the next stage, then a vertical path through the empire. Tests whether visible progression feels more like a game.',
      };
      const query = new URLSearchParams(location.search);
      let variant = variants.includes(query.get('variant')) ? query.get('variant') : 'A';
      let businessArt = ['outline', 'none'].includes(query.get('art'))
        ? query.get('art')
        : 'illustrated';
      let palette = ['midnight', 'ash'].includes(query.get('palette'))
        ? query.get('palette')
        : 'graphite';
      const makeState = (scenario) => ({
        scenario,
        screen: 'earn',
        walletLevel: 0,
        filter: 'Owned',
        cash: scenario === 'first' ? 0 : scenario === 'diversified' ? 28420 : 4820,
        marketFilter: 'Stocks',
        propertyFilter: 'All',
        wealthTab: 'Summary',
        selectedAsset: 'prism',
        selectedProperty: 'studio',
        orderQuantity: 1,
        positions:
          scenario === 'diversified'
            ? { prism: { quantity: 10, cost: 1100 }, block: { quantity: 2, cost: 520 } }
            : {},
        properties: scenario === 'diversified' ? { studio: { rented: true, renovation: 0 } } : {},
        watchlist: ['prism'],
        realized: 0,
        activity: [],
        treasury: scenario === 'first' ? 0 : 620,
        units: scenario === 'first' ? 1 : 3,
        capitalizedSpend: scenario === 'first' ? {} : { vending: 965, food_cart: 1250 },
        payout: 50,
        stock: scenario === 'attention' ? 0 : 65,
        owned: scenario === 'first' ? [] : ['vending', 'food_cart'],
        notice: '',
        confirmation: null,
      });
      let state = makeState(
        ['first', 'operating', 'attention', 'diversified'].includes(query.get('scenario'))
          ? query.get('scenario')
          : 'diversified',
      );
      state.screen = 'earn';
      const catalog = [
        { id: 'vending', name: 'Vending Machine', icon: '▥', price: 250, profit: 100, tier: 1 },
        { id: 'food_cart', name: 'Food Cart', icon: '♨', price: 1250, profit: 500, tier: 1 },
        {
          id: 'coffee_kiosk',
          name: 'Coffee Kiosk',
          icon: '☕',
          price: 4000,
          profit: 1600,
          tier: 1,
        },
        { id: 'laundromat', name: 'Laundromat', icon: '◉', price: 7500, profit: 2500, tier: 2 },
        { id: 'car_wash', name: 'Car Wash', icon: '◈', price: 30000, profit: 9000, tier: 2 },
        { id: 'bakery', name: 'Bakery', icon: '♨', price: 100000, profit: 28000, tier: 2 },
      ];
      const money = (n) =>
        '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const button = (label, action, kind = 'secondary', disabled = false) =>
        `<button class="${kind}" data-action="${action}" ${disabled ? 'disabled' : ''}>${label}</button>`;
      const owned = (id) => state.owned.includes(id);
      const income = () =>
        catalog
          .filter((b) => owned(b.id))
          .reduce(
            (total, b) =>
              total +
              (b.id === 'vending'
                ? state.stock === 0
                  ? 0
                  : (30 * state.payout) / 100
                : b.profit / 20),
            0,
          );
      const businessWorth = () =>
        state.owned.reduce((total, id) => total + (state.capitalizedSpend[id] ?? 0), 0) +
        (owned('vending') ? state.treasury : 0);
      const artwork = {
        vending:
          '<rect x="13" y="6" width="29" height="44" rx="4"/><rect x="18" y="11" width="15" height="24" rx="2"/><path d="M23 12v22m5-22v22m-10-15h15m-15 8h15M36 17h2m-2 5h2M20 41h15M18 50v3m20-3v3"/>',
        food_cart:
          '<path d="M8 28h37v16H8zM7 22l5-11h29l6 11zM12 22v6m29-6v6M45 32h5v12h-5"/><circle cx="16" cy="48" r="4"/><circle cx="38" cy="48" r="4"/><path d="M16 12v10m10-10v10m10-10v10"/>',
        coffee_kiosk:
          '<path d="M8 23l6-12h29l6 12zM13 23v27h30V23M10 50h36M19 31h17v11H19zM25 7V3m7 4V3"/><path d="M36 33h3v6h-3M16 23v4m8-4v4m8-4v4m8-4v4"/>',
        laundromat:
          '<rect x="9" y="9" width="38" height="41" rx="4"/><path d="M9 19h38M15 14h6m17 0h3"/><circle cx="28" cy="34" r="11"/><path d="M19 35c5-7 12 7 18-1"/>',
        car_wash:
          '<path d="M7 48V18l21-9 21 9v30M13 45V22h30v23M20 22v7m8-7v7m8-7v7"/><path d="M17 45v-8l4-6h14l4 6v8zM18 37h20M22 41h2m8 0h2"/>',
        bakery:
          '<path d="M8 24l5-12h30l5 12M12 24v26h32V24M8 50h40M14 24v4m9-4v4m10-4v4m10-4v4"/><path d="M19 43v-4c0-8 18-8 18 0v4zM24 34l2 5m5-5 2 5"/>',
      };
      function businessVisual(id) {
        if (businessArt === 'none') return '';
        return `<div class="business-visual ${businessArt}" aria-hidden="true"><svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${artwork[id]}</svg></div>`;
      }
      function header() {
        return `<div class="status"><span>9:41</span><span>POCKET MOGUL &nbsp; ▰</span></div><header class="top"><div class="topline"><div><div class="eyebrow">Available cash</div><div class="cash">${money(state.cash)}</div></div><div><div class="income">+${money(income() + rentalIncome())}/min</div><div class="muted">To your cash</div></div></div><div class="goal"><span>Tier 2 ${state.scenario === 'first' ? 'locked' : 'unlocked'}</span><span class="meter"><i style="width:${state.scenario === 'first' ? 0 : 100}%"></i></span><span>◇ Goals</span></div></header>`;
      }
      function navIcon(id) {
        const paths = {
          businesses:
            '<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V3h8v4M3 12h18M10 12v3h4v-3"/>',
          markets: '<path d="M4 20V10m8 10V4m8 16v-8M2 21h20"/>',
          earn: '<path d="M13 2L5 13h6l-1 9 9-12h-6z"/>',
          properties: '<path d="M3 11l9-8 9 8M5 10v11h14V10M10 21v-7h4v7"/>',
          wealth: '<path d="M11 3a9 9 0 109 10h-9zM14 2v8h8a9 9 0 00-8-8z"/>',
        };
        return `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${paths[id]}</svg>`;
      }
      function tabs() {
        return `<nav class="nav" aria-label="Game tabs">${[
          ['businesses', '▥', 'Businesses'],
          ['markets', '↗', 'Markets'],
          ['earn', 'ϟ', 'Earn'],
          ['properties', '⌂', 'Properties'],
          ['wealth', '◎', 'Wealth'],
        ]
          .map(
            ([id, icon, label]) =>
              `<button class="${state.screen === id ? 'active' : ''} ${id === 'earn' ? 'center-tab' : ''}" data-action="tab:${id}" aria-current="${state.screen === id ? 'page' : 'false'}"><span>${navIcon(id)}</span>${label}</button>`,
          )
          .join('')}</nav>`;
      }
      const art = () =>
        '<div class="art" aria-hidden="true"><div class="building">▦</div><div class="building">▥<br>▦</div><div class="building">▤</div></div>';
      function filters() {
        return `<div class="chips">${['Owned', 'Tier 1', 'Tier 2', 'Tier 3', 'Tier 4'].map((f) => button(f, 'filter:' + f, state.filter === f ? 'active' : '')).join('')}</div>`;
      }
      function businessRow(b) {
        const isOwned = owned(b.id);
        return `<div class="row line">${businessVisual(b.id)}<div class="name"><b>${b.name}</b><span class="muted">${isOwned ? (b.id === 'vending' ? 'Local · ' + state.units + ' machines' : 'Startup · 1 cart') : 'Tier ' + b.tier + ' · +' + money(b.profit / 20) + '/min to cash'}</span>${isOwned ? `<div class="${b.id === 'vending' && state.stock === 0 ? 'red' : 'green'}">${b.id === 'vending' && state.stock === 0 ? '! Out of stock' : '+' + money(b.id === 'vending' ? (30 * state.payout) / 100 : b.profit / 20) + '/min to cash'}</div>` : ''}</div>${button(isOwned ? 'Open →' : money(b.price), isOwned ? 'open:' + b.id : 'buy:' + b.id, isOwned ? '' : 'primary', !isOwned && state.cash < b.price)}</div>`;
      }
      function rows() {
        const list = catalog.filter((b) =>
          state.filter === 'Owned' ? owned(b.id) : b.tier === Number(state.filter.slice(-1)),
        );
        if (!list.length)
          return `<div class="empty"><h3>${state.filter === 'Owned' ? 'No businesses owned' : 'Tier locked'}</h3><p class="muted">${state.filter === 'Owned' ? 'Earn $250 to buy your first Vending Machine.' : 'Tier 3 at $200k peak net worth; Tier 4 at $8m.'}</p>${button(state.filter === 'Owned' ? 'Go to Earn' : 'View Tier 1', state.filter === 'Owned' ? 'tab:earn' : 'filter:Tier 1', 'primary wide')}</div>`;
        return list.map(businessRow).join('');
      }
      function variantA() {
        return `<div class="worth"><div class="muted">Business net worth</div><h1>${money(businessWorth())}</h1><div class="row"><span class="muted">${state.owned.length} owned</span><span class="green">+${money(income())}/min to cash</span></div></div>${filters()}${rows()}`;
      }
      function variantB() {
        return `<div class="row"><div><div class="eyebrow">Build something bigger</div><h1>Your empire.</h1></div><span class="badge">${state.owned.length} OWNED</span></div><div class="hero">${art()}<div class="row"><div><div class="eyebrow">${state.owned.length ? 'Empire cash flow' : 'Your first move'}</div><div class="big gold">${state.owned.length ? '$' + income().toFixed(0) : '$250'}<small class="muted">${state.owned.length ? '/min' : ' to start'}</small></div></div></div></div>${state.owned.length ? `<div class="notice"><b>${state.stock === 0 ? '! Vending needs stock' : 'Next move · Vending Machine'}</b><p class="muted">${state.stock === 0 ? 'Machines have stopped serving. Restock from the business treasury.' : 'Three machines. Local stage. Place stock where your customers are.'}</p>${button('Run the business →', 'open:vending', 'secondary wide')}</div>` : button('Tap your way to a business →', 'tab:earn', 'primary wide')}${filters()}${rows()}`;
      }
      function variantC() {
        return `<div class="eyebrow">Small beginnings. Big ambitions.</div><h1>From corner shop<br>to empire.</h1><div class="notice"><span class="badge">NEXT CHAPTER</span><h3>${state.owned.length ? 'Take Vending regional' : 'Own your first business'}</h3><p class="muted">${state.owned.length ? 'Local → Regional · 3 of 8 machines · day 6 of 10' : 'Tap to $250, then own a Vending Machine.'}</p>${button(state.owned.length ? 'Continue building →' : 'Start earning →', state.owned.length ? 'open:vending' : 'tab:earn', 'primary wide')}</div>${filters()}<div class="timeline">${
          state.filter === 'Owned' && state.owned.length
            ? catalog
                .filter((b) => owned(b.id))
                .map(
                  (b) =>
                    `<div class="stop"><span class="badge">${b.id === 'vending' ? '02 · LOCAL' : '01 · STARTUP'}</span>${businessRow(b)}</div>`,
                )
                .join('')
            : rows()
        }<div class="stop locked"><span class="eyebrow">On the horizon</span><h3>Regional business</h3><p class="muted">Grow to unlock takeovers.</p></div></div>`;
      }
      function overview() {
        return `<section class="section" id="overview"><h2>Overview</h2><div class="split"><div class="metric"><span class="muted">Profit / business day</span><b class="green">$300.00</b></div><div class="metric"><span class="muted">Treasury</span><b>${money(state.treasury)}</b></div></div><p class="muted">Illustrative Local snapshot · 1 business day = 10 minutes.<br>Revenue $420 · costs $120 · 300 snacks/day</p><div class="line row"><span>Price per snack</span><b>$1.40 · Standard</b></div><label class="label" for="payout">Payout to your cash: ${state.payout}% · remainder stays here</label><input id="payout" type="range" min="0" max="100" step="10" value="${state.payout}"><div class="split">${button('Deposit $100', 'deposit', 'secondary', state.cash < 100)}${button('Withdraw all', 'withdraw', 'secondary', state.treasury === 0)}</div>${button('Sell business…', 'sell', 'wide red')}</section>`;
      }
      function mechanic() {
        return `<section class="section" id="mechanic"><h2>Placement & stock</h2><div class="row"><div><h3>Office · ${state.units} machines</h3><p class="muted">Balanced mix · ${state.stock}% stock remaining</p></div><span class="${state.stock === 0 ? 'red' : 'green'}">${state.stock === 0 ? '! Empty' : '● Serving'}</span></div><div class="meter" style="margin-top:14px"><i style="width:${state.stock}%"></i></div>${button('Restock all · $30 treasury', 'restock', 'primary wide', state.treasury < 30 || state.stock === 100)}<p class="muted">Sample restock fee. Restockers automate this daily.</p></section>`;
      }
      function grow() {
        return `<section class="section" id="grow"><h2>Grow</h2><div class="row line"><div><h3>${state.units} / 8 machines</h3><p class="muted">Local stage · expand capacity</p></div>${button('Add · $' + unitPrice(), 'unit', 'primary', state.treasury < unitPrice() || state.units >= 8)}</div><div class="line"><h3>Regional is next</h3><p class="muted">Requires 8 machines and 10 days owned. Sample: day 6.<br>Unlocks takeovers · stage price $2,000 from treasury</p></div></section>`;
      }
      function detail() {
        const heads =
          variant === 'A'
            ? `<span class="badge">TIER 1 · LOCAL</span><h1>Vending Machine</h1>`
            : variant === 'B'
              ? `<div class="hero"><span class="badge">LOCAL · DAY 6</span>${art()}<h1>Vending Machine</h1><p class="muted">Own the corner. Then the city.</p></div>`
              : `<span class="eyebrow">Your next chapter</span><h1>Go Regional.</h1><p class="muted">Vending Machine · Local → Regional</p><div class="notice">${state.units}/8 machines · 6/10 days · treasury ${money(state.treasury)}</div>`;
        return `${button('← Businesses', 'tab:businesses', 'back')}${heads}${variant === 'A' ? '' : `<div class="rail">${['Overview', 'Mechanic', 'Grow', 'Staff', 'Risks', 'Deals'].map((s) => button(s, 'jump:' + s.toLowerCase())).join('')}</div>`}${variant === 'B' ? mechanic() + overview() + grow() : variant === 'C' ? grow() + overview() + mechanic() : overview() + mechanic() + grow()}<section id="staff"><h2>Staff</h2><div class="line"><h3>Restockers · 0 of 5</h3><p class="muted">+20% capacity each; automatically restock every day.</p></div><div class="line"><h3>Manager · not hired</h3><p class="muted">Chooses the best price and stock mix. Never spends your personal cash.</p></div></section><section id="risks"><h2>Risks</h2><div class="notice">No active incidents. Equipment, liability and supply insurance available at Local stage.</div></section><section id="deals"><h2>Deals</h2><p class="muted">Takeovers unlock at Regional.<br>Going public unlocks at National.</p></section>`;
      }
      const tapAmount = () => 1 + state.walletLevel * 0.5;
      const walletUpgradeCost = () =>
        Math.ceil(100 * Math.pow(1.45, state.walletLevel) * 100) / 100;
      const walletDrawing = () =>
        '<svg viewBox="0 0 180 112" aria-hidden="true"><path d="M28 26L131 12q9-1 9 9v66L28 95z" fill="var(--scene-side)" stroke="var(--dim)"/><rect x="20" y="31" width="140" height="71" rx="12" fill="var(--raised)" stroke="var(--gold)" stroke-width="2"/><rect x="126" y="51" width="42" height="31" rx="7" fill="var(--panel)" stroke="var(--gold)" stroke-width="2"/><circle cx="140" cy="66" r="4" fill="var(--gold)"/><path d="M37 48h39m-39 9h24" stroke="var(--dim)" stroke-width="2"/></svg>';
      function earn() {
        const next = catalog.find((b) => !owned(b.id));
        return `<button class="home-worth" data-action="tab:wealth"><span class="muted">Net worth <span aria-hidden="true">↗</span></span><b>${money(netWorth())}</b></button><div class="home-stats">${stat('Business payouts', money(income()) + '/min')}${stat('Net rent', money(rentalIncome()) + '/min')}</div><button class="tap-zone" data-action="tap" aria-label="Tap wallet to earn ${money(tapAmount())}">${walletDrawing()}<span class="tap-value">+${money(tapAmount())}</span><span class="muted">per tap · wallet level ${state.walletLevel}</span></button><div class="wallet-upgrade"><div><b>Wallet upgrade</b><small>${money(tapAmount())} → ${money(tapAmount() + 0.5)}/tap</small></div>${button(money(walletUpgradeCost()), 'walletUpgrade', 'primary', state.cash < walletUpgradeCost() || state.walletLevel >= 100)}</div><div class="home-summary"><button data-action="tab:businesses"><span class="muted">Businesses</span><b>${state.owned.length}</b><small>${money(businessWorth())}</small></button><button data-action="tab:markets"><span class="muted">Investments</span><b>${Object.keys(state.positions).length}</b><small>${money(marketWorth())}</small></button><button data-action="tab:properties"><span class="muted">Properties</span><b>${Object.keys(state.properties).length}</b><small>${money(propertyWorth())}</small></button></div>${owned('vending') && state.stock === 0 ? `<button class="home-action" data-action="open:vending"><span><b>Vending · out of stock</b><small>Restock from treasury</small></span><span>→</span></button>` : next ? `<button class="home-action" data-action="filter:Tier ${next.tier}"><span><b>${next.name}</b><small>${money(next.price)} · ${state.cash >= next.price ? 'Affordable' : money(next.price - state.cash) + ' to go'}</small></span><span>→</span></button>` : ''}`;
      }
      const assets = [
        {
          id: 'prism',
          name: 'Prism Devices',
          symbol: 'PRSM',
          kind: 'Stocks',
          price: 120,
          change: 2.4,
          dividend: 0.12,
        },
        {
          id: 'parcelvine',
          name: 'Parcelvine Logistics',
          symbol: 'PVLG',
          kind: 'Stocks',
          price: 85,
          change: -1.2,
          dividend: 0.085,
        },
        {
          id: 'ironclad',
          name: 'Ironclad Industries',
          symbol: 'IRCL',
          kind: 'Stocks',
          price: 410,
          change: 0.8,
          dividend: 0.41,
        },
        {
          id: 'willowbrook',
          name: 'Willowbrook Health',
          symbol: 'WLBH',
          kind: 'Stocks',
          price: 320,
          change: 1.6,
          dividend: 0.32,
        },
        {
          id: 'block',
          name: 'Block Crown',
          symbol: 'BKC',
          kind: 'Crypto',
          price: 250,
          change: 4.1,
          dividend: 0,
        },
        {
          id: 'ether',
          name: 'Ember Chain',
          symbol: 'EMB',
          kind: 'Crypto',
          price: 80,
          change: -3.2,
          dividend: 0,
        },
        {
          id: 'moss',
          name: 'Moss Network',
          symbol: 'MOS',
          kind: 'Crypto',
          price: 5,
          change: 1.9,
          dividend: 0,
        },
      ];
      const homes = [
        { id: 'studio', name: 'City Studio', price: 20000, rent: 120, upkeep: 20 },
        { id: 'house', name: 'Starter House', price: 80000, rent: 450, upkeep: 70 },
        { id: 'duplex', name: 'Duplex', price: 250000, rent: 1300, upkeep: 200 },
        { id: 'apartments', name: 'Apartment Building', price: 1000000, rent: 4800, upkeep: 800 },
      ];
      const assetOf = () => assets.find((a) => a.id === state.selectedAsset);
      const homeOf = () => homes.find((h) => h.id === state.selectedProperty);
      const homeUpgradeCost = (h) => h.price * 0.1;
      const homeValue = (h) =>
        h.price + (state.properties[h.id]?.renovation ?? 0) * homeUpgradeCost(h) * 0.8;
      const homeRent = (h) => h.rent * (1 + (state.properties[h.id]?.renovation ?? 0) * 0.1);
      const propertyWorth = () =>
        homes.reduce((total, h) => total + (state.properties[h.id] ? homeValue(h) : 0), 0);
      const marketWorth = () =>
        assets.reduce((total, a) => total + (state.positions[a.id]?.quantity ?? 0) * a.price, 0);
      const investedCost = () =>
        Object.values(state.positions).reduce((total, p) => total + p.cost, 0);
      const rentalIncome = () =>
        homes.reduce(
          (total, h) => total + (state.properties[h.id]?.rented ? homeRent(h) - h.upkeep : 0),
          0,
        );
      const dividends = () =>
        assets.reduce((total, a) => total + (state.positions[a.id]?.quantity ?? 0) * a.dividend, 0);
      const netWorth = () => state.cash + businessWorth() + propertyWorth() + marketWorth();
      const signedMoney = (n) => (n < 0 ? '−' : '+') + money(Math.abs(n));
      const log = (text) => {
        state.notice = text;
        state.activity.unshift(text);
      };
      const selectedChips = (values, current, action) =>
        `<div class="chips">${values.map((v) => button(v, action + ':' + v, current === v ? 'active' : '')).join('')}</div>`;
      const stat = (label, value) =>
        `<div><span class="muted">${label}</span><b>${value}</b></div>`;
      function wealth() {
        const unrealized = marketWorth() - investedCost();
        const categories = [
          ['Cash', state.cash, 'earn'],
          ['Businesses', businessWorth(), 'businesses'],
          [
            'Stocks',
            assets
              .filter((a) => a.kind === 'Stocks')
              .reduce((t, a) => t + (state.positions[a.id]?.quantity ?? 0) * a.price, 0),
            'markets',
          ],
          [
            'Crypto',
            assets
              .filter((a) => a.kind === 'Crypto')
              .reduce((t, a) => t + (state.positions[a.id]?.quantity ?? 0) * a.price, 0),
            'markets',
          ],
          ['Properties', propertyWorth(), 'properties'],
        ];
        return `<div class="wealth-head"><span class="muted">Net worth</span><h1>${money(netWorth())}</h1></div><div class="stats-grid">${stat('Income to cash', money(income() + rentalIncome()) + '/min')}${stat('Market value', money(marketWorth()))}${stat('Unrealized P&L', signedMoney(unrealized))}${stat('Realized P&L', signedMoney(state.realized))}</div>${selectedChips(['Summary', 'Holdings', 'Activity'], state.wealthTab, 'wealthTab')}${state.wealthTab === 'Summary' ? wealthSummary(categories) : state.wealthTab === 'Holdings' ? wealthHoldings() : `<h2>Activity</h2>${state.activity.length ? state.activity.map((text) => `<div class="dense-line">${text}</div>`).join('') : '<p class="muted">No transactions yet.</p>'}`}`;
      }
      function wealthSummary(categories) {
        const total = netWorth();
        return `<h2>Allocation</h2><div class="allocation live-allocation" role="img" aria-label="Allocation by current holding value">${categories.map(([name, value], i) => `<i style="width:${total ? (value / total) * 100 : 0}%;background:var(--asset-${i})" title="${name}: ${money(value)}"></i>`).join('')}</div><div class="table-head"><span>Asset</span><span>Value / share</span></div>${categories.map(([name, value, tab], i) => `<button class="dense-line allocation-row" data-action="category:${name}"><span><i class="swatch" style="background:var(--asset-${i})"></i>${name}</span><span><b>${money(value)}</b><small>${total ? ((value / total) * 100).toFixed(1) : '0.0'}%</small></span></button>`).join('')}<h2>Income</h2><div class="dense-line row"><span>Business payouts</span><b>${money(income())}/min</b></div><div class="dense-line row"><span>Net rent</span><b>${money(rentalIncome())}/min</b></div><div class="dense-line row"><span>Dividends</span><b>${money(dividends())}/hour</b></div><details class="valuation"><summary>Valuation basis</summary><p>Cash + private business investment and treasury + properties + market holdings. Listed business stakes count at market value once. No pending dividends in this sample.</p></details>`;
      }
      function wealthHoldings() {
        return `<h2>Businesses</h2>${
          catalog
            .filter((b) => owned(b.id))
            .map(
              (b) =>
                `<button class="dense-line allocation-row" data-action="open:${b.id}"><span>${b.name}</span><b>${money((state.capitalizedSpend[b.id] ?? 0) + (b.id === 'vending' ? state.treasury : 0))}</b></button>`,
            )
            .join('') || '<p class="muted">None owned.</p>'
        }<h2>Market positions</h2>${
          assets
            .filter((a) => state.positions[a.id])
            .map((a) => {
              const p = state.positions[a.id];
              return `<button class="dense-line holding-row" data-action="asset:${a.id}"><span><b>${a.symbol} · ${p.quantity}</b><small>Avg ${money(p.cost / p.quantity)}</small></span><span><b>${money(p.quantity * a.price)}</b><small class="${p.quantity * a.price >= p.cost ? 'green' : 'red'}">${signedMoney(p.quantity * a.price - p.cost)}</small></span></button>`;
            })
            .join('') || '<p class="muted">No market positions.</p>'
        }<h2>Properties</h2>${
          homes
            .filter((h) => state.properties[h.id])
            .map(
              (h) =>
                `<button class="dense-line allocation-row" data-action="property:${h.id}"><span>${h.name}</span><b>${money(homeValue(h))}</b></button>`,
            )
            .join('') || '<p class="muted">None owned.</p>'
        }`;
      }
      function markets() {
        const list = assets.filter((a) =>
          state.marketFilter === 'Watchlist'
            ? state.watchlist.includes(a.id)
            : a.kind === state.marketFilter,
        );
        return `<div class="wealth-head"><span class="muted">Market holdings</span><h1>${money(marketWorth())}</h1></div><div class="row"><span class="muted">Unrealized P&L</span><b class="${marketWorth() >= investedCost() ? 'green' : 'red'}">${signedMoney(marketWorth() - investedCost())}</b></div>${selectedChips(['Stocks', 'Crypto', 'Watchlist'], state.marketFilter, 'marketFilter')}<div class="table-head"><span>Asset</span><span>Price / 24h</span></div>${list.map((a) => `<button class="market-row" data-action="asset:${a.id}"><span class="ticker-mark">${a.symbol.slice(0, 2)}</span><span class="name"><b>${a.symbol}</b><small>${a.name}</small></span><span class="quote"><b>${money(a.price)}</b><small class="${a.change >= 0 ? 'green' : 'red'}">${a.change >= 0 ? '+' : ''}${a.change.toFixed(1)}%</small></span></button>`).join('') || '<p class="muted">No watched assets.</p>'}<p class="footnote">All companies and coins are fictional.</p>`;
      }
      function assetDetail() {
        const a = assetOf(),
          p = state.positions[a.id];
        return `${button('← Markets', 'tab:markets', 'back')}<div class="row"><div><h2>${a.name}</h2><span class="muted">${a.symbol} · ${a.kind}</span></div>${button(state.watchlist.includes(a.id) ? '★' : '☆', 'watch', 'secondary')}</div><div class="price-heading">${money(a.price)} <small class="${a.change >= 0 ? 'green' : 'red'}">${a.change >= 0 ? '+' : ''}${a.change}% / 24h</small></div><svg class="price-chart ${a.change < 0 ? 'negative' : ''}" viewBox="0 0 320 90" role="img" aria-label="Illustrative price history; current sample price ${money(a.price)}"><g transform="${a.change < 0 ? 'translate(0 90) scale(1 -1)' : ''}"><path d="M0 72L20 67L40 73L60 48L80 53L100 39L120 44L140 26L160 40L180 30L200 35L220 15L240 28L260 10L280 18L320 8" fill="none" stroke="currentColor" stroke-width="2"/></g></svg><p class="muted">24h sample · ${a.change >= 0 ? '+' : ''}${a.change}%</p><div class="stats-grid">${stat('Quantity', p?.quantity ?? 0)}${stat('Average cost', p ? money(p.cost / p.quantity) : '—')}${stat('Position value', money((p?.quantity ?? 0) * a.price))}${stat('Unrealized P&L', signedMoney((p?.quantity ?? 0) * a.price - (p?.cost ?? 0)))}</div><h2>Order quantity</h2>${selectedChips(['1', '10'], String(state.orderQuantity), 'quantity')}<div class="split">${button('Buy · ' + money(a.price * state.orderQuantity), 'trade:buy', 'primary', !state.owned.length)}${button('Sell · ' + money(a.price * state.orderQuantity), 'trade:sell', 'secondary', !p || p.quantity < state.orderQuantity)}</div>${!state.owned.length ? '<p class="footnote">Trading unlocks with your first business.</p>' : ''}<div class="dense-line row"><span>Dividend / share</span><b>${money(a.dividend)}/hour</b></div>`;
      }
      function propertyScene(h) {
        const windows = (x, y, cols, rows) =>
          Array.from(
            { length: cols * rows },
            (_, i) =>
              `<rect x="${x + (i % cols) * 22}" y="${y + Math.floor(i / cols) * 22}" width="10" height="13" rx="1" fill="var(--scene-window)"/>`,
          ).join('');
        const buildings = {
          studio: `<path d="M62 133V24l105-9 65 31v87z" fill="var(--scene-wall)"/><path d="M167 15l65 31v87h-65z" fill="var(--scene-side)"/>${windows(80, 35, 3, 4)}${windows(184, 52, 2, 3)}<path d="M72 134V111h86v23" fill="var(--scene-roof)"/>`,
          house: `<path d="M43 77l70-47 64 47v57H43z" fill="var(--scene-wall)"/><path d="M113 30l58 12 57 42h-51z" fill="var(--scene-side)"/><path d="M34 79l79-55 74 55" fill="none" stroke="var(--scene-roof)" stroke-width="8"/><path d="M177 84h53v50h-53z" fill="var(--scene-wall)"/>${windows(61, 88, 2, 1)}<rect x="119" y="93" width="25" height="41" fill="var(--scene-side)"/><path d="M150 49V27h13v33" fill="var(--scene-roof)"/>`,
          duplex: `<path d="M48 72l49-38 49 38 49-38 48 38v62H48z" fill="var(--scene-wall)"/><path d="M41 73l56-45 49 40 49-40 54 45" fill="none" stroke="var(--scene-roof)" stroke-width="7"/>${windows(66, 82, 3, 1)}${windows(166, 82, 3, 1)}<rect x="106" y="108" width="18" height="26" fill="var(--scene-side)"/><rect x="202" y="108" width="18" height="26" fill="var(--scene-side)"/>`,
          apartments: `<path d="M44 133V25h170v108z" fill="var(--scene-wall)"/><path d="M214 25l40 18v90h-40z" fill="var(--scene-side)"/>${windows(60, 38, 7, 4)}<path d="M41 24h176v8H41z" fill="var(--scene-roof)"/><rect x="120" y="108" width="25" height="25" fill="var(--scene-side)"/>`,
        };
        return `<svg viewBox="0 0 300 155" class="property-scene" role="img" aria-label="Original illustration of ${h.name}"><rect width="300" height="155" fill="var(--scene-sky)"/><circle cx="251" cy="30" r="14" fill="var(--scene-sun)"/><path d="M0 105l35-10 35 7 45-6 65 8 50-9 70 12v48H0z" fill="var(--scene-land)"/><path d="M0 133h300v22H0z" fill="var(--scene-road)"/>${buildings[h.id]}<path d="M0 140h300" stroke="var(--dim)" stroke-opacity=".3"/><path d="M18 135v-22m-8 5q8-30 16 0" fill="var(--scene-land)" stroke="var(--scene-land)" stroke-width="8"/><path d="M274 135v-22m-8 5q8-30 16 0" fill="var(--scene-land)" stroke="var(--scene-land)" stroke-width="8"/></svg>`;
      }
      function propertyCard(h) {
        const p = state.properties[h.id];
        return `<article class="property-card"><button class="property-open" data-action="property:${h.id}"><div class="property-picture">${propertyScene(h)}<span class="property-status">${p ? (p.rented ? 'Rented' : 'Vacant') : 'For sale'}</span></div><div class="property-caption"><h3>${h.name}<span aria-hidden="true">↗</span></h3><div class="property-figures">${stat(p ? 'Property value' : 'Purchase price', money(p ? homeValue(h) : h.price))}${stat(p?.rented ? 'Net rent' : 'Potential net rent', money(homeRent(h) - h.upkeep) + '/min')}</div></div></button></article>`;
      }
      function properties() {
        const list = homes.filter(
          (h) => state.propertyFilter !== 'Owned' || state.properties[h.id],
        );
        return `<div class="property-totals">${stat('Property value', money(propertyWorth()))}${stat('Net rent', money(rentalIncome()) + '/min')}</div>${selectedChips(['All', 'Owned'], state.propertyFilter, 'propertyFilter')}${list.map(propertyCard).join('') || '<p class="muted">No properties owned.</p>'}`;
      }
      function propertyDetail() {
        const h = homeOf(),
          p = state.properties[h.id];
        return `${button('← Properties', 'tab:properties', 'back')}<div class="detail-property-picture">${propertyScene(h)}</div><h2>${h.name}</h2><div class="price-heading">${money(p ? homeValue(h) : h.price)}</div><div class="stats-grid">${stat('Gross rent', money(homeRent(h)) + '/min')}${stat('Upkeep while rented', money(h.upkeep) + '/min')}${stat('Net rent', money(homeRent(h) - h.upkeep) + '/min')}${stat('Status', p ? (p.rented ? 'Rented' : 'Vacant') : 'Available')}</div>${p ? `${button(p.rented ? 'Stop renting' : 'Rent out', 'rent', 'primary wide')}<h2>Renovation</h2><div class="dense-line row"><span>Level ${p.renovation} / 1</span><b>+${money(h.rent * 0.1)}/min</b></div>${button('Renovate · ' + money(homeUpgradeCost(h)) + ' cash', 'renovate', 'secondary wide', p.renovation === 1 || state.cash < homeUpgradeCost(h))}<p class="footnote">Value +${money(homeUpgradeCost(h) * 0.8)} · upkeep unchanged.</p>${button('Sell · ' + money(homeValue(h) * 0.95), 'propertySell', 'wide red')}` : button('Buy · ' + money(h.price), 'propertyBuy', 'primary wide', state.cash < h.price)}`;
      }
      function transactionSheet() {
        const kind = state.confirmation;
        if (!['tradeBuy', 'tradeSell', 'propertyBuy', 'propertySell'].includes(kind)) return '';
        const trade = kind.startsWith('trade'),
          buy = kind.endsWith('Buy'),
          a = assetOf(),
          h = homeOf();
        const gross = trade ? a.price * state.orderQuantity : buy ? h.price : homeValue(h) * 0.95;
        const fee = trade ? gross * (a.kind === 'Crypto' ? 0.02 : 0.01) : 0;
        const total = buy ? gross + fee : gross - fee;
        return `<div class="sheet" role="dialog" aria-label="Review transaction"><h3>${buy ? 'Buy' : 'Sell'} ${trade ? state.orderQuantity + ' ' + a.symbol : h.name}</h3><div class="dense-line row"><span>Cash ${buy ? 'cost' : 'received'}</span><b>${money(total)}</b></div>${trade ? `<p class="muted">Fee ${money(fee)} · holdings after: ${(state.positions[a.id]?.quantity ?? 0) + (buy ? state.orderQuantity : -state.orderQuantity)}</p>` : `<p class="muted">${buy ? 'Becomes owned and vacant; rent is $0 until rented.' : 'Ownership and rental income are removed.'}</p>`}<p class="muted">Cash after: ${money(state.cash + (buy ? -total : total))}</p><div class="split">${button('Cancel', 'cancel')}${button('Confirm', 'confirm', 'primary', buy && state.cash < total)}</div></div>`;
      }
      function confirmAssetTransaction() {
        const kind = state.confirmation,
          a = assetOf(),
          h = homeOf();
        if (kind === 'propertyBuy' && state.cash >= h.price) {
          state.cash -= h.price;
          state.properties[h.id] = { rented: false, renovation: 0 };
          log(h.name + ' bought · ' + money(h.price));
        }
        if (kind === 'propertySell' && state.properties[h.id]) {
          state.cash += homeValue(h) * 0.95;
          delete state.properties[h.id];
          log(h.name + ' sold');
        }
        if (kind === 'tradeBuy' || kind === 'tradeSell') {
          const qty = state.orderQuantity,
            gross = qty * a.price,
            fee = gross * (a.kind === 'Crypto' ? 0.02 : 0.01),
            p = state.positions[a.id] ?? { quantity: 0, cost: 0 };
          if (kind === 'tradeBuy' && state.owned.length && state.cash >= gross + fee) {
            state.cash -= gross + fee;
            state.positions[a.id] = { quantity: p.quantity + qty, cost: p.cost + gross + fee };
            log('Bought ' + qty + ' ' + a.symbol + ' · ' + money(gross + fee));
          }
          if (kind === 'tradeSell' && p.quantity >= qty) {
            const basis = (p.cost * qty) / p.quantity;
            state.cash += gross - fee;
            state.realized += gross - fee - basis;
            state.positions[a.id] = { quantity: p.quantity - qty, cost: p.cost - basis };
            if (state.positions[a.id].quantity === 0) delete state.positions[a.id];
            log('Sold ' + qty + ' ' + a.symbol + ' · ' + money(gross - fee));
          }
        }
        state.confirmation = null;
      }
      function navigateSample(type, value) {
        if (type === 'marketFilter') state.marketFilter = value;
        if (type === 'propertyFilter') state.propertyFilter = value;
        if (type === 'wealthTab') state.wealthTab = value;
        if (type === 'quantity') state.orderQuantity = Number(value);
        if (type === 'asset') {
          state.selectedAsset = value;
          state.screen = 'asset';
          state.orderQuantity = 1;
        }
        if (type === 'property') {
          state.selectedProperty = value;
          state.screen = 'property';
        }
        if (type === 'category') {
          state.screen = {
            Cash: 'earn',
            Businesses: 'businesses',
            Stocks: 'markets',
            Crypto: 'markets',
            Properties: 'properties',
          }[value];
          if (value === 'Stocks' || value === 'Crypto') state.marketFilter = value;
        }
        if (type === 'watch') {
          const id = assetOf().id;
          state.watchlist = state.watchlist.includes(id)
            ? state.watchlist.filter((x) => x !== id)
            : [...state.watchlist, id];
        }
        if (type === 'trade') state.confirmation = value === 'buy' ? 'tradeBuy' : 'tradeSell';
        if (type === 'propertyBuy' || type === 'propertySell') state.confirmation = type;
        if (type === 'rent') {
          const p = state.properties[homeOf().id];
          p.rented = !p.rented;
          log(homeOf().name + (p.rented ? ' rented' : ' vacated'));
        }
        if (type === 'renovate') {
          const p = state.properties[homeOf().id];
          if (p && p.renovation === 0 && state.cash >= homeUpgradeCost(homeOf())) {
            state.cash -= homeUpgradeCost(homeOf());
            p.renovation = 1;
            log(homeOf().name + ' renovated · ' + money(homeUpgradeCost(homeOf())));
          }
        }
      }
      function sheet() {
        if (!state.confirmation) return '';
        if (['tradeBuy', 'tradeSell', 'propertyBuy', 'propertySell'].includes(state.confirmation))
          return transactionSheet();
        const withdraw = state.confirmation === 'withdraw';
        return `<div class="sheet" role="dialog" aria-label="Review transaction"><h3>${withdraw ? 'Withdraw the whole treasury?' : 'Sell Vending Machine?'}</h3><p class="muted">${withdraw ? money(state.treasury) + ' to cash; treasury becomes $0.00. Ownership and income unchanged.' : 'Sample sale value $150 plus remaining treasury to cash. You lose this business and its income.'}</p><div class="split">${button('Cancel', 'cancel')}${button('Confirm', 'confirm', 'primary')}</div></div>`;
      }
      function render() {
        document.getElementById('phone').dataset.palette = palette;
        document.getElementById('phone').innerHTML =
          header() +
          (state.notice ? `<div class="toast" role="status">${state.notice}</div>` : '') +
          `<div class="content">${sheet()}${state.screen === 'detail' ? detail() : state.screen === 'earn' ? earn() : state.screen === 'wealth' ? wealth() : state.screen === 'markets' ? markets() : state.screen === 'asset' ? assetDetail() : state.screen === 'properties' ? properties() : state.screen === 'property' ? propertyDetail() : { A: variantA, B: variantB, C: variantC }[variant]()}</div>` +
          (state.screen === 'detail' ? '' : tabs());
        document.getElementById('variant-label').textContent = variant + ' · ' + names[variant];
        document.getElementById('hypothesis').textContent = hypotheses[variant];
        document.getElementById('state').textContent = JSON.stringify(
          {
            variant,
            businessArt,
            palette,
            businessNetWorth: businessWorth(),
            ...state,
            economy: 'illustrative; engine not connected',
          },
          null,
          2,
        );
      }
      const unitPrice = () => Math.round(100 * Math.pow(1.15, state.units - 1));
      function cycle(delta) {
        variant = variants[(variants.indexOf(variant) + delta + 3) % 3];
        const url = new URL(location.href);
        url.searchParams.set('variant', variant);
        history.replaceState(null, '', url);
        render();
      }
      function transact(action) {
        if (
          action === 'walletUpgrade' &&
          state.cash >= walletUpgradeCost() &&
          state.walletLevel < 100
        ) {
          state.cash -= walletUpgradeCost();
          state.walletLevel += 1;
          log('Wallet upgraded · ' + money(tapAmount()) + '/tap');
        }
        if (action === 'tap') {
          state.cash += tapAmount();
          state.notice = '+' + money(tapAmount()) + ' · tap earned';
        }
        if (action === 'deposit' && state.cash >= 100) {
          state.cash -= 100;
          state.treasury += 100;
          state.notice = '$100 moved from cash to treasury';
        }
        if (action === 'restock' && state.treasury >= 30) {
          state.treasury -= 30;
          state.stock = 100;
          state.notice = 'Stock filled · $30 from treasury';
        }
        if (action === 'unit' && state.treasury >= unitPrice() && state.units < 8) {
          const cost = unitPrice();
          state.treasury -= cost;
          state.units += 1;
          state.capitalizedSpend.vending = (state.capitalizedSpend.vending ?? 0) + cost;
          state.notice =
            'Machine added · ' +
            money(cost) +
            ' from treasury. Income delta requires an engine quote.';
        }
      }
      function confirm() {
        if (['tradeBuy', 'tradeSell', 'propertyBuy', 'propertySell'].includes(state.confirmation)) {
          confirmAssetTransaction();
          return;
        }
        if (state.confirmation === 'withdraw') {
          state.cash += state.treasury;
          state.treasury = 0;
          state.notice = 'Treasury withdrawn to cash';
        }
        if (state.confirmation === 'sell') {
          state.cash += 150 + state.treasury;
          state.treasury = 0;
          state.owned = state.owned.filter((id) => id !== 'vending');
          state.screen = 'businesses';
          state.notice = 'Vending sold · sample proceeds added to cash';
        }
        state.confirmation = null;
      }
      function act(action) {
        const [type, value] = action.split(':');
        if (type === 'next' || type === 'prev') {
          cycle(type === 'next' ? 1 : -1);
          return;
        }
        if (type === 'reset') state = makeState(state.scenario);
        if (type === 'tab') {
          state.screen = value;
          state.confirmation = null;
          state.notice = '';
          const url = new URL(location.href);
          url.searchParams.delete('screen');
          history.replaceState(null, '', url);
        }
        navigateSample(type, value);
        if (type === 'filter') {
          state.screen = 'businesses';
          state.filter = value;
        }
        if (type === 'open') {
          if (value === 'vending') state.screen = 'detail';
          else state.notice = 'Vending is the interactive deep-business example.';
        }
        if (type === 'buy') {
          const b = catalog.find((b) => b.id === value);
          if (!owned(value) && state.cash >= b.price) {
            state.cash -= b.price;
            state.owned.push(value);
            state.capitalizedSpend[value] = b.price;
            state.notice = b.name + ' bought · +' + money(b.profit / 20) + '/min to cash';
          }
        }
        if (type === 'jump') {
          document.getElementById(value)?.scrollIntoView({ block: 'start' });
          return;
        }
        if (type === 'withdraw' || type === 'sell') state.confirmation = type;
        if (type === 'cancel') state.confirmation = null;
        if (type === 'confirm') confirm();
        transact(type);
        if (state.notice && state.activity[0] !== state.notice)
          state.activity.unshift(state.notice);
        render();
      }
      document.addEventListener('click', (event) => {
        const target = event.target.closest('[data-action]');
        if (target && !target.disabled) act(target.dataset.action);
      });
      document.addEventListener('change', (event) => {
        if (event.target.id === 'palette') {
          palette = event.target.value;
          const url = new URL(location.href);
          url.searchParams.set('palette', palette);
          history.replaceState(null, '', url);
          render();
        }
        if (event.target.id === 'business-art') {
          businessArt = event.target.value;
          const url = new URL(location.href);
          url.searchParams.set('art', businessArt);
          history.replaceState(null, '', url);
          render();
        }
        if (event.target.id === 'scenario') {
          const tab = ['earn', 'businesses', 'markets', 'properties', 'wealth'].includes(
            state.screen,
          )
            ? state.screen
            : 'earn';
          state = makeState(event.target.value);
          state.screen = tab;
          const url = new URL(location.href);
          url.searchParams.set('scenario', state.scenario);
          history.replaceState(null, '', url);
          render();
        }
        if (event.target.id === 'payout') {
          state.payout = Number(event.target.value);
          state.notice = 'Payout set to ' + state.payout + '% · no time simulation';
          render();
        }
      });
      document.addEventListener('keydown', (event) => {
        if (event.target.closest('input,textarea,select,[contenteditable]')) return;
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          event.preventDefault();
          cycle(event.key === 'ArrowRight' ? 1 : -1);
        }
      });
      if (query.get('mode') === 'production') document.querySelector('.switcher').hidden = true;
      document.getElementById('palette').value = palette;
      document.getElementById('scenario').value = state.scenario;
      document.getElementById('business-art').value = businessArt;
      render();
    </script>
  </body>
</html>
