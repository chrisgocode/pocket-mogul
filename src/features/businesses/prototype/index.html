    <main class="study">

        </details>

      <details class="palette-archive">
        <summary>Archived palette studies · Studio selected</summary>
        <select id="palette" aria-label="Color palette">
          <option value="mixed">Studio · mixed accents</option>
          <option value="afterhours">After Hours · peach · mint</option>
          <option value="marina">Marina · citrus · aqua</option>
          <option value="arcade">Arcade · lime · electric pink</option>
          <option value="espresso">Espresso · butter · sage</option>
          <option value="paper">Paper · jade · indigo</option>

          <option value="midnight">Midnight · blue</option>

      <div class="switcher">

    </main>
    <script>
      const variants = ['A', 'B', 'C'];
      const names = { A: 'The Ledger', B: 'Command Center', C: 'Empire Journey' };
      const hypotheses = {
        A: 'A · Selected direction: business net worth replaces decorative headings. Compare two-tone illustrations, outline icons and text-only rows with the artwork selector.',
        B: 'B · Command Center: lead with the business scene and its next operational action. Tests whether a clear priority makes deep mechanics approachable.',
        C: 'C · Empire Journey: lead with the next stage, then a vertical path through the empire. Tests whether visible progression feels more like a game.',
      };
      const query = new URLSearchParams(location.search);
      let variant = variants.includes(query.get('variant')) ? query.get('variant') : 'A';
      let businessArt = ['outline', 'none'].includes(query.get('art'))
        ? query.get('art')
        : 'illustrated';
      const categoryPalettes = ['mixed', 'afterhours', 'marina', 'arcade', 'espresso', 'paper'];
      const palettePreviews = [
        {
          id: 'mixed',
          name: 'Studio',
          colors: ['#eabb72', '#76d5c0', '#b6a5ef', '#edab91', '#9ac6f1'],
        },
        {
          id: 'afterhours',
          name: 'After Hours',
          colors: ['#f5b88c', '#8edabf', '#c7b3fa', '#f0a6b5', '#91cfe5'],
        },
        {
          id: 'marina',
          name: 'Marina',
          colors: ['#ffd077', '#79dccd', '#b9b1fa', '#ffb49b', '#81c8fa'],
        },
        {
          id: 'arcade',
          name: 'Arcade',
          colors: ['#d9ef80', '#79e1d2', '#efaff2', '#ffba87', '#8cceff'],
        },
        {
          id: 'espresso',
          name: 'Espresso',
          colors: ['#ead59a', '#b1cfab', '#c8b5e6', '#edb09b', '#a7c9dc'],
        },
        {
          id: 'paper',
          name: 'Paper',
          colors: ['#9b501b', '#1e7465', '#68509e', '#a24f3d', '#286d9a'],
        },
      ];
      let palette = [...categoryPalettes, 'graphite', 'midnight', 'ash'].includes(
        query.get('palette'),
      )
        ? query.get('palette')
        : 'mixed';
      const makeState = (scenario) => ({
        scenario,
        screen: 'earn',
        walletLevel: 0,
        stage: scenario === 'first' ? 1 : 2,
        daysOwned: scenario === 'first' ? 0 : 6,
        operation: scenario === 'recovery' ? 'closed' : 'open',
        focusedSection: null,
        screenStack: [],
        tax: { status: 'current', amount: scenario === 'first' ? 0 : 10, paid: 0 },
        goalFilter: 'All',
        completedGoals: [],
        pinnedGoal: null,
        peakWorth: 0,
        settings: {
          sound: 'on',
          haptics: 'on',
          reducedMotion: 'system',
          numberFormatting: 'compact',
        },
        filter: 'Owned',
        cash: scenario === 'first' ? 0 : scenario === 'diversified' ? 28420 : 4820,
        marketFilter: 'Stocks',
        marketMode: scenario === 'diversified' ? 'Portfolio' : 'Explore',
        marketQuery: '',
        marketSort: 'Name',
        propertyFilter: 'All',
        wealthTab: 'Summary',
        selectedAsset: 'prism',
        selectedProperty: 'studio',
        orderQuantity: 1,
        positions:
          scenario === 'diversified'
            ? { prism: { quantity: 10, cost: 1100 }, block: { quantity: 2, cost: 520 } }
            : {},
        properties: scenario === 'diversified' ? { studio: { rented: true, renovation: 0 } } : {},
        watchlist: ['prism'],
        realized: 0,
        activity: [],
        treasury: scenario === 'first' || scenario === 'recovery' ? 0 : 620,
        units: scenario === 'first' ? 1 : 3,
        capitalizedSpend: scenario === 'first' ? {} : { vending: 965, food_cart: 1250 },
        payout: 50,
        stock: scenario === 'attention' ? 0 : 65,
        owned: scenario === 'first' ? [] : ['vending', 'food_cart'],
        notice: '',
        confirmation: null,
      });
      let state = makeState(
        ['first', 'operating', 'attention', 'diversified', 'recovery'].includes(
          query.get('scenario'),
        )
          ? query.get('scenario')
          : 'diversified',
      );
      state.screen = 'earn';
      const catalog = [
        { id: 'vending', name: 'Vending Machine', icon: '▥', price: 250, profit: 100, tier: 1 },
        { id: 'food_cart', name: 'Food Cart', icon: '♨', price: 1250, profit: 500, tier: 1 },
        {
          id: 'coffee_kiosk',
          name: 'Coffee Kiosk',
          icon: '☕',
          price: 4000,
          profit: 1600,
          tier: 1,
        },
        { id: 'laundromat', name: 'Laundromat', icon: '◉', price: 7500, profit: 2500, tier: 2 },
        { id: 'car_wash', name: 'Car Wash', icon: '◈', price: 30000, profit: 9000, tier: 2 },
        { id: 'bakery', name: 'Bakery', icon: '♨', price: 100000, profit: 28000, tier: 2 },
      ];
      const money = (n) =>
        '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const button = (label, action, kind = 'secondary', disabled = false) =>
        `<button class="${kind}" data-action="${action}" ${disabled || (purchasesBlocked() && isDiscretionary(action)) ? 'disabled' : ''}>${label}</button>`;
      const owned = (id) => state.owned.includes(id);
      const tradingUnlocked = () =>
        state.owned.length > 0 || state.completedGoals.includes('first_business');
      const stageLabels = ['Startup', 'Local', 'Regional', 'National', 'Global'];
      const unitCaps = [3, 8, 20, 50, 120];
      const stageDays = [3, 10, 30, 60];
      const stageCosts = [500, 2000, 7500, 30000];
      const stageLabel = () => stageLabels[state.stage - 1];
      const unitCap = () => unitCaps[state.stage - 1];
      const vendingProfit = () =>
        state.operation === 'closed' || (state.stage >= 2 && state.stock === 0)
          ? 0
          : state.units * 100;
      const vendingCashRate = () => ((vendingProfit() / 10) * state.payout) / 100;
      const income = () =>
        catalog
          .filter((b) => owned(b.id))
          .reduce((sum, b) => sum + (b.id === 'vending' ? vendingCashRate() : b.profit / 20), 0);
      const businessWorth = () =>
        state.owned.reduce((total, id) => total + (state.capitalizedSpend[id] ?? 0), 0) +
        (owned('vending') ? state.treasury : 0);
      const artwork = {
        vending:
          '<rect x="13" y="6" width="29" height="44" rx="4"/><rect x="18" y="11" width="15" height="24" rx="2"/><path d="M23 12v22m5-22v22m-10-15h15m-15 8h15M36 17h2m-2 5h2M20 41h15M18 50v3m20-3v3"/>',
        food_cart:
          '<path d="M8 28h37v16H8zM7 22l5-11h29l6 11zM12 22v6m29-6v6M45 32h5v12h-5"/><circle cx="16" cy="48" r="4"/><circle cx="38" cy="48" r="4"/><path d="M16 12v10m10-10v10m10-10v10"/>',
        coffee_kiosk:
          '<path d="M8 23l6-12h29l6 12zM13 23v27h30V23M10 50h36M19 31h17v11H19zM25 7V3m7 4V3"/><path d="M36 33h3v6h-3M16 23v4m8-4v4m8-4v4m8-4v4"/>',
        laundromat:
          '<rect x="9" y="9" width="38" height="41" rx="4"/><path d="M9 19h38M15 14h6m17 0h3"/><circle cx="28" cy="34" r="11"/><path d="M19 35c5-7 12 7 18-1"/>',
        car_wash:
          '<path d="M7 48V18l21-9 21 9v30M13 45V22h30v23M20 22v7m8-7v7m8-7v7"/><path d="M17 45v-8l4-6h14l4 6v8zM18 37h20M22 41h2m8 0h2"/>',
        bakery:
          '<path d="M8 24l5-12h30l5 12M12 24v26h32V24M8 50h40M14 24v4m9-4v4m10-4v4m10-4v4"/><path d="M19 43v-4c0-8 18-8 18 0v4zM24 34l2 5m5-5 2 5"/>',
      };
      function businessVisual(id) {
        if (businessArt === 'none') return '';
        return `<div class="business-visual ${businessArt}" data-business="${id}" aria-hidden="true"><svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${artwork[id]}</svg></div>`;
      }
      const goals = [
        {
          id: 'first_wallet_upgrade',
          title: 'First wallet upgrade',
          hint: 'Upgrade your wallet',
          check: () => state.walletLevel > 0,
        },
        {
          id: 'first_business',
          title: 'First business',
          hint: 'Buy a business',
          check: () => state.owned.length > 0,
        },
        {
          id: 'first_rental',
          title: 'First rental',
          hint: 'Rent out a property',
          check: () => Object.values(state.properties).some((p) => p.rented),
        },
        {
          id: 'first_stock',
          title: 'First stock purchase',
          hint: 'Buy shares in Markets',
          check: () => assets.some((a) => a.kind === 'Stocks' && state.positions[a.id]),
        },
        {
          id: 'first_crypto',
          title: 'First crypto purchase',
          hint: 'Buy a coin in Markets',
          check: () => assets.some((a) => a.kind === 'Crypto' && state.positions[a.id]),
        },
        {
          id: 'first_dividend',
          title: 'First dividend',
          hint: 'Receive your first stock dividend',
          check: () => false,
        },
        ...[
          [1000, 'peak_1k'],
          [10000, 'peak_10k'],
          [100000, 'peak_100k'],
          [1000000, 'peak_1m'],
          [10000000, 'peak_10m'],
          [100000000, 'peak_100m'],
          [1000000000, 'peak_1b'],
        ].map(([threshold, id]) => ({
          id,
          title:
            'Worth ' +
            new Intl.NumberFormat('en-US', {
              style: 'currency',
              currency: 'USD',
              notation: 'compact',
              maximumFractionDigits: 0,
            }).format(threshold),
          threshold,
          hint: 'Peak net worth',
          check: () => state.peakWorth >= threshold,
        })),
      ];
      const utilityScreens = ['goals', 'settings', 'about', 'taxes'];
      const screenLabel = (screen) =>
        ({
          earn: 'Earn',
          businesses: 'Businesses',
          markets: 'Markets',
          properties: 'Properties',
          wealth: 'Wealth',
          detail: 'Business',
          asset: 'Asset',
          property: 'Property',
          profile: 'Profile',
          goals: 'Goals',
          settings: 'Settings',
          about: 'About',
          taxes: 'Taxes',
        })[screen] ?? 'Earn';
      const summaryMoney = (amount) =>
        state.settings.numberFormatting === 'compact' && amount >= 1000
          ? '$' +
            new Intl.NumberFormat('en-US', {
              notation: 'compact',
              maximumFractionDigits: 2,
            }).format(amount)
          : money(amount);
      function syncGoals() {
        state.peakWorth = Math.max(state.peakWorth, netWorth());
        for (const goal of goals)
          if (goal.check() && !state.completedGoals.includes(goal.id))
            state.completedGoals.push(goal.id);
        if (state.completedGoals.includes(state.pinnedGoal)) state.pinnedGoal = null;
      }
      function utilityIcon(kind) {
        const paths = {
          profile: '<circle cx="12" cy="8" r="4"/><path d="M4 22v-3a8 8 0 0116 0v3"/>',
          goals:
            '<path d="M8 3h8v6a4 4 0 01-8 0zM8 5H4v3a4 4 0 004 4m8-7h4v3a4 4 0 01-4 4M12 13v6m-4 2h8"/>',
          taxes: '<path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4"/>',
          settings:
            '<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/>',
        };
        return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">${paths[kind] ?? paths.profile}</svg>`;
      }
      function goalShortcut() {
        const goal =
          goals.find((g) => g.id === state.pinnedGoal) ??
          goals.find((g) => !state.completedGoals.includes(g.id));
        return `<button class="goal-shortcut" data-action="utility:goals" aria-label="Open Goals and achievements">${utilityIcon('goals')}<span><b>${goal ? goal.title : 'All achievements earned'}</b><small>Goals · ${state.completedGoals.length}/${goals.length}${state.pinnedGoal ? ' · Pinned' : ''}</small></span><span aria-hidden="true">→</span></button>`;
      }
      const hasBottomTabs = () =>
        state.screen !== 'detail' && !utilityScreens.includes(state.screen);
      const cashFlowQuote = () => cashCreditQuote(income() + rentalIncome());
      function header() {
        return `<div class="status"><span>9:41</span><span>POCKET MOGUL</span></div><header class="top"><div class="topline"><div><div class="eyebrow">Cash</div><div class="cash">${summaryMoney(state.cash)}</div></div><div class="header-income"><div class="income">+${money(cashFlowQuote().net)}/min</div><div class="muted">Cash flow</div></div>${hasBottomTabs() ? '' : `<button class="profile-button" data-action="utility:profile" aria-label="Open Profile">${utilityIcon('profile')}</button>`}</div>${state.screen === 'earn' ? goalShortcut() : ''}</header>`;
      }
      function openUtility(screen) {
        if (state.screen === screen) return;
        if (screen === 'profile') {
          state.screen = 'profile';
          state.screenStack = [];
          state.confirmation = null;
          state.notice = '';
          return;
        }
        const index = state.screenStack.indexOf(screen);
        state.screenStack =
          index >= 0 ? state.screenStack.slice(0, index) : [...state.screenStack, state.screen];
        state.screen = screen;
        state.confirmation = null;
        state.notice = '';
      }
      const utilityBack = () =>
        button(
          '← ' + screenLabel(state.screenStack[state.screenStack.length - 1] ?? 'earn'),
          'utilityBack',
          'back',
        );
      function taxFixture(status) {
        return {
          status,
          amount:
            status === 'debt'
              ? 3000
              : status === 'ready' || status === 'pending'
                ? 1000
                : status === 'current'
                  ? 10
                  : 0,
          paid: status === 'paid' ? 1000 : 0,
          fine: status === 'debt' ? 2000 : 0,
        };
      }
      const taxLiability = () =>
        ['current', 'ready', 'debt'].includes(state.tax.status) ? state.tax.amount : 0;
      const purchasesBlocked = () =>
        ['ready', 'debt'].includes(state.tax.status) && state.tax.amount > 0;
      const isDiscretionary = (action) =>
        ['buy', 'unit', 'upgradeStage', 'walletUpgrade', 'renovate', 'propertyBuy'].includes(
          action.split(':')[0],
        ) || action === 'trade:buy';
      const taxRate = () =>
        state.tax.status === 'exempt' || (state.tax.status === 'current' && state.tax.amount === 0)
          ? 0
          : 0.04;

        const p = state.properties[h.id],
          index = homes.indexOf(h) + 1;
        return `<article class="property-record" data-property="${h.id}"><button class="register-entry" data-action="property:${h.id}"><div class="register-top"><span class="record-number">P0${index}</span><span class="muted">Renovation · Lv ${p?.renovation ?? 0}</span><span class="record-state">${p ? (p.rented ? '● Rented' : '○ Vacant') : 'For sale'}</span></div><div class="register-body"><div><h3>${h.name}</h3><div class="register-price">${money(p ? homeValue(h) : h.price)}</div></div><div class="register-drawing">${propertyScene(h)}</div></div><div class="register-data">${stat(p ? 'Net / min' : 'Potential net / min', money(p && !p.rented ? 0 : homeRent(h) - h.upkeep))}${stat('Gross / min', money(p && !p.rented ? 0 : homeRent(h)))}<span class="record-link">${p ? 'Manage' : 'Inspect'} ↗</span></div></button></article>`;
      }
      function properties() {
        const list = homes.filter(
          (h) => state.propertyFilter !== 'Owned' || state.properties[h.id],
        );
        return `<div class="register-summary"><div><span class="muted">Property value</span><b>${money(propertyWorth())}</b></div><div><span class="muted">Net rent / min</span><b>${money(rentalIncome())}</b></div></div><div class="register-tools">${selectedChips(['All', 'Owned'], state.propertyFilter, 'propertyFilter')}<span class="muted">${list.length} properties</span></div>${list.map(propertyCard).join('') || '<p class="muted">No properties owned.</p>'}`;
      }
      function propertyDetail() {
        const h = homeOf(),
          p = state.properties[h.id];
        return `${button('← Properties', 'tab:properties', 'back')}<div class="property-detail-heading"><div><span class="record-number">P0${homes.indexOf(h) + 1}</span><h2>${h.name}</h2></div><div class="register-drawing">${propertyScene(h)}</div></div><div class="price-heading">${money(p ? homeValue(h) : h.price)}</div><div class="stats-grid">${stat('Gross rent', money(homeRent(h)) + '/min')}${stat('Upkeep / min', money(h.upkeep) + '/min')}${stat('Net rent', money(homeRent(h) - h.upkeep) + '/min')}${stat('Status', p ? (p.rented ? 'Rented' : 'Vacant') : 'Available')}</div>${p ? `${button(p.rented ? 'Stop renting' : 'Rent out', 'rent', 'primary wide')}<h2>Renovation</h2><div class="dense-line row"><span>Level ${p.renovation} / 1</span><b>+${money(h.rent * 0.1)}/min</b></div>${button('Renovate · ' + money(homeUpgradeCost(h)) + ' cash', 'renovate', 'secondary wide', p.renovation === 1 || state.cash < homeUpgradeCost(h))}<div class="dense-line row"><span>Value increase</span><b>+${money(homeUpgradeCost(h) * 0.8)}</b></div>${button('Sell · ' + money(homeValue(h) * 0.95), 'propertySell', 'wide red')}` : button('Buy · ' + money(h.price), 'propertyBuy', 'primary wide', state.cash < h.price)}`;
      }
      const sheetActions = (label, disabled = false) =>
        `<div class="sheet-actions">${button(label, 'confirm', 'primary', disabled)}${button('Cancel', 'cancel', 'secondary')}</div>`;
      function transactionSheet() {
        const kind = state.confirmation;
        if (!['tradeBuy', 'tradeSell', 'propertyBuy', 'propertySell'].includes(kind)) return '';
        const trade = kind.startsWith('trade'),
          buy = kind.endsWith('Buy'),
          a = assetOf(),
          h = homeOf();
        const gross = trade ? a.price * state.orderQuantity : buy ? h.price : homeValue(h) * 0.95;
        const fee = trade ? gross * (a.kind === 'Crypto' ? 0.02 : 0.01) : 0,
          total = buy ? gross + fee : gross - fee;
        const credit = cashCreditQuote(total);
        return `<div class="sheet" role="dialog" aria-label="Review transaction"><h3>${buy ? 'Buy' : 'Sell'} ${trade ? state.orderQuantity + ' ' + a.symbol : h.name}</h3>${fee ? `<div class="dense-line row"><span>Fee</span><b>${money(fee)}</b></div>` : ''}${buy ? `<div class="dense-line row"><span>Cash cost</span><b>${money(total)}</b></div><div class="dense-line row"><span>Cash after</span><b>${money(state.cash - total)}</b></div>` : cashCreditLines(credit)}<div class="dense-line row"><span>${trade ? 'Quantity after' : 'Property after'}</span><b>${trade ? (state.positions[a.id]?.quantity ?? 0) + (buy ? state.orderQuantity : -state.orderQuantity) : buy ? 'Owned · vacant' : 'Sold'}</b></div>${sheetActions(buy ? 'Buy · ' + money(total) : 'Sell · ' + money(credit.net), buy && state.cash < total)}</div>`;
      }
      function confirmAssetTransaction() {
        const kind = state.confirmation,
          a = assetOf(),
          h = homeOf();
        if (kind === 'propertyBuy' && state.cash >= h.price) {
          state.cash -= h.price;
          state.properties[h.id] = { rented: false, renovation: 0 };
          log(h.name + ' bought · ' + money(h.price));
        }
        if (kind === 'propertySell' && state.properties[h.id]) {
          creditCash(homeValue(h) * 0.95);
          delete state.properties[h.id];
          log(h.name + ' sold');
        }
        if (kind === 'tradeBuy' || kind === 'tradeSell') {
          const qty = state.orderQuantity,
            gross = qty * a.price,
            fee = gross * (a.kind === 'Crypto' ? 0.02 : 0.01),
            p = state.positions[a.id] ?? { quantity: 0, cost: 0 };
          if (kind === 'tradeBuy' && tradingUnlocked() && state.cash >= gross + fee) {
            state.cash -= gross + fee;
            state.positions[a.id] = { quantity: p.quantity + qty, cost: p.cost + gross + fee };
            log('Bought ' + qty + ' ' + a.symbol + ' · ' + money(gross + fee));
          }
          if (kind === 'tradeSell' && p.quantity >= qty) {
            const basis = (p.cost * qty) / p.quantity;
            const credit = creditCash(gross - fee);
            state.realized += gross - fee - basis;
            state.positions[a.id] = { quantity: p.quantity - qty, cost: p.cost - basis };
            if (state.positions[a.id].quantity === 0) delete state.positions[a.id];
            log('Sold ' + qty + ' ' + a.symbol + ' · ' + money(credit.net) + ' received');
          }
        }
        state.confirmation = null;
      }
      function navigateSample(type, value) {
        if (type === 'marketMode') {
          state.marketMode = value;
          state.marketQuery = '';
        }
        if (type === 'marketFilter') {
          state.marketFilter = value;
          state.marketQuery = '';
        }
        if (type === 'propertyFilter') state.propertyFilter = value;
        if (type === 'wealthTab') state.wealthTab = value;
        if (type === 'quantity') state.orderQuantity = Number(value);
        if (type === 'asset') {
          state.selectedAsset = value;
          state.screen = 'asset';
          state.orderQuantity = 1;
        }
        if (type === 'property') {
          state.selectedProperty = value;
          state.screen = 'property';
        }
        if (type === 'category') {
          state.screen = {
            Cash: 'earn',
            Businesses: 'businesses',
            Stocks: 'markets',
            Crypto: 'markets',
            Properties: 'properties',
          }[value];
          if (value === 'Stocks' || value === 'Crypto') {
            state.marketFilter = value;
            state.marketMode = 'Explore';
          }
        }
        if (type === 'watch') {
          const id = assetOf().id;
          state.watchlist = state.watchlist.includes(id)
            ? state.watchlist.filter((x) => x !== id)
            : [...state.watchlist, id];
        }
        if (type === 'trade') state.confirmation = value === 'buy' ? 'tradeBuy' : 'tradeSell';
        if (type === 'propertyBuy' || type === 'propertySell') state.confirmation = type;
        if (type === 'rent') {
          const p = state.properties[homeOf().id];
          p.rented = !p.rented;
          log(homeOf().name + (p.rented ? ' rented' : ' vacated'));
        }
        if (type === 'renovate') {
          const p = state.properties[homeOf().id];
          if (p && p.renovation === 0 && state.cash >= homeUpgradeCost(homeOf())) {
            state.cash -= homeUpgradeCost(homeOf());
            p.renovation = 1;
            log(homeOf().name + ' renovated · ' + money(homeUpgradeCost(homeOf())));
          }
        }
      }
      function sheet() {
        if (!state.confirmation) return '';
        if (['taxFull', 'taxZero', 'taxDebt'].includes(state.confirmation))
          return taxConfirmation();
        if (state.confirmation === 'resetProgress')
          return `<div class="sheet" role="dialog" aria-label="Reset progress confirmation"><h3>Reset progress?</h3><p class="muted">${money(state.cash)} cash, ${state.owned.length} businesses and ${Object.keys(state.properties).length} properties and ${Object.keys(state.positions).length} market positions will be removed.</p>${sheetActions('Reset')}</div>`;
        if (['tradeBuy', 'tradeSell', 'propertyBuy', 'propertySell'].includes(state.confirmation))
          return transactionSheet();
        const withdraw = state.confirmation === 'withdraw';
        const quote = cashCreditQuote(withdraw ? state.treasury : businessSaleProceeds());
        return `<div class="sheet" role="dialog" aria-label="Review transaction"><h3>${withdraw ? 'Withdraw treasury?' : 'Sell Vending Machine?'}</h3>${cashCreditLines(quote)}<div class="dense-line row"><span>Business after</span><b>${withdraw ? 'Still owned' : 'Sold · income removed'}</b></div><div class="dense-line row"><span>Treasury after</span><b>$0.00</b></div>${sheetActions((withdraw ? 'Withdraw · ' : 'Sell · ') + money(quote.net))}</div>`;
      }

      function render() {
        syncGoals();
        document.getElementById('tax-sample').value = [
          'current',
          'ready',
          'pending',
          'debt',
          'exempt',
        ].includes(state.tax.status)
          ? state.tax.status
          : 'current';
        document.getElementById('audit-sample-button').hidden = state.tax.status !== 'pending';
        document.getElementById('phone').dataset.motion = state.settings.reducedMotion;
        document.getElementById('phone').dataset.palette = palette;
        document.getElementById('phone').dataset.colorSystem = categoryPalettes.includes(palette)
          ? 'category'
          : 'single';
        document.getElementById('palette').value = palette;
        document.getElementById('palette-choices').innerHTML = palettePreviews
          .map(
            (p) =>
              `<button data-action="palette:${p.id}" aria-pressed="${p.id === palette}"><span>${p.name}</span><span class="palette-dots" aria-hidden="true">${p.colors.map((color) => `<i style="background:${color}"></i>`).join('')}</span></button>`,
          )
          .join('');
        document.getElementById('phone').dataset.section =
          {
            detail: 'businesses',
            asset: 'markets',
            property: 'properties',
            profile: 'wealth',
            goals: 'wealth',
            settings: 'wealth',
            about: 'wealth',
            taxes: 'wealth',
          }[state.screen] ?? state.screen;
        document.getElementById('phone').innerHTML =
          header() +
          (state.notice ? `<div class="toast" role="status">${state.notice}</div>` : '') +
          `<div class="content">${sheet()}${taxNotice()}${utilityScreens.includes(state.screen) ? { goals: goalsScreen, settings: settingsScreen, about: aboutScreen, taxes: taxesScreen }[state.screen]() : state.screen === 'profile' ? profile() : state.screen === 'detail' ? detail() : state.screen === 'earn' ? earn() : state.screen === 'wealth' ? wealth() : state.screen === 'markets' ? markets() : state.screen === 'asset' ? assetDetail() : state.screen === 'properties' ? properties() : state.screen === 'property' ? propertyDetail() : { A: variantA, B: variantB, C: variantC }[variant]()}</div>` +
          (hasBottomTabs() ? tabs() : '');
        if (state.focusedSection) {
          const target = document.getElementById(state.focusedSection);
          const content = document.querySelector('#phone .content');
          if (target && content) content.scrollTop = target.offsetTop ?? 0;
          state.focusedSection = null;
        }
        document.getElementById('variant-label').textContent = variant + ' · ' + names[variant];
        document.getElementById('hypothesis').textContent = hypotheses[variant];
        document.getElementById('state').textContent = JSON.stringify(
          {
            variant,
            businessArt,
            palette,
            businessNetWorth: businessWorth(),
            ...state,
            economy: 'illustrative; engine not connected',
          },
          null,
          2,
        );
      }
      const businessSaleProceeds = () =>
        Math.floor((Math.round((state.capitalizedSpend.vending ?? 0) * 100) * 60) / 100) / 100 +
        state.treasury;
      const unitPrice = () => Math.round(100 * Math.pow(1.15, state.units - 1));
      function cycle(delta) {
        variant = variants[(variants.indexOf(variant) + delta + 3) % 3];
        const url = new URL(location.href);
        url.searchParams.set('variant', variant);
        history.replaceState(null, '', url);
        render();
      }
      function transact(action) {
        if (
          action === 'walletUpgrade' &&
          state.cash >= walletUpgradeCost() &&
          state.walletLevel < 100
        ) {
          state.cash -= walletUpgradeCost();
          state.walletLevel += 1;
          log('Wallet upgraded · ' + money(tapAmount()) + '/tap');
        }
        if (action === 'tap') {
          state.cash += tapAmount();
          state.notice = '+' + money(tapAmount()) + ' · tap earned';
        }
        if (action === 'deposit' && state.cash >= 100) {
          state.cash -= 100;
          state.treasury += 100;
          state.operation = 'open';
          state.notice = '$100 moved from cash to treasury';
        }
        if (action === 'restock' && state.treasury >= 30) {
          state.treasury -= 30;
          state.stock = 100;
          state.notice = 'Stock filled · $30 from treasury';
        }
        if (action === 'unit' && state.treasury >= unitPrice() && state.units < unitCap()) {
          const cost = unitPrice();
          state.treasury -= cost;
          state.units += 1;
          state.capitalizedSpend.vending = (state.capitalizedSpend.vending ?? 0) + cost;
          state.notice = 'Machine added · ' + money(cost) + ' from treasury';
        }
      }
      function confirm() {
        if (['taxFull', 'taxZero', 'taxDebt'].includes(state.confirmation)) {
          confirmTax();
          return;
        }
        if (state.confirmation === 'resetProgress') {
          const settings = state.settings;
          state = makeState('first');
          state.settings = settings;
          document.getElementById('scenario').value = 'first';
          return;
        }
        if (['tradeBuy', 'tradeSell', 'propertyBuy', 'propertySell'].includes(state.confirmation)) {
          confirmAssetTransaction();
          return;
        }
        if (state.confirmation === 'withdraw') {
          creditCash(state.treasury);
          state.treasury = 0;
          state.notice = 'Treasury withdrawn to cash';
        }
        if (state.confirmation === 'sell') {
          creditCash(businessSaleProceeds());
          state.treasury = 0;
          state.owned = state.owned.filter((id) => id !== 'vending');
          state.screen = 'businesses';
          state.notice = 'Vending sold · sample proceeds added to cash';
        }
        state.confirmation = null;
      }
      function choosePalette(value) {
        palette = value;
        const url = new URL(location.href);
        url.searchParams.set('palette', value);
        history.replaceState(null, '', url);
      }
      function act(action) {
        const [type, value] = action.split(':');
        if (purchasesBlocked() && isDiscretionary(action)) {
          state.notice = 'Resolve the tax return or assessed debt before making purchases.';
          render();
          return;
        }
        if (type === 'palette') choosePalette(value);
        utilityAction(type, value);
        if (type === 'next' || type === 'prev') {
          cycle(type === 'next' ? 1 : -1);
          return;
        }
        if (type === 'reset') state = makeState(state.scenario);
        if (type === 'tab') {
          state.screen = value === 'wealth' ? 'profile' : value;
          state.screenStack = [];
          state.confirmation = null;
          state.notice = '';
          const url = new URL(location.href);
          url.searchParams.delete('screen');
          history.replaceState(null, '', url);
        }
        decisionAction(type, value);
        navigateSample(type, value);
        if (type === 'filter') {
          state.screen = 'businesses';
          state.filter = value;
        }
        if (type === 'open') {
          if (value === 'vending') state.screen = 'detail';
          else state.notice = 'Vending is the interactive deep-business example.';
        }
        if (type === 'buy') {
          const b = catalog.find((b) => b.id === value);
          if (!owned(value) && state.cash >= b.price) {
            state.cash -= b.price;
            state.owned.push(value);
            state.capitalizedSpend[value] = b.price;
            if (value === 'vending') {
              state.stage = 1;
              state.units = 1;
              state.daysOwned = 0;
              state.treasury = 0;
              state.operation = 'open';
              state.stock = 65;
            }
            state.notice = b.name + ' bought · +' + money(b.profit / 20) + '/min to cash';
          }
        }
        if (type === 'jump') {
          document.getElementById(value)?.scrollIntoView({ block: 'start' });
          return;
        }
        if (type === 'withdraw' || type === 'sell') state.confirmation = type;
        if (type === 'cancel') state.confirmation = null;
        if (type === 'confirm') confirm();
        transact(type);
        if (state.notice && state.activity[0] !== state.notice)
          state.activity.unshift(state.notice);
        render();
      }
      document.addEventListener('click', (event) => {
        const target = event.target.closest('[data-action]');
        if (target && !target.disabled) act(target.dataset.action);
      });
      document.addEventListener('input', (event) => {
        if (event.target.id === 'market-search') {
          state.marketQuery = event.target.value;
          document.getElementById('market-results').innerHTML = marketResults();
          document.getElementById('state').textContent = JSON.stringify(
            { variant, palette, businessArt, ...state },
            null,
            2,
          );
        }
      });
      document.addEventListener('change', (event) => {
        if (event.target.id === 'tax-sample') {
          state.tax = taxFixture(event.target.value);
          state.confirmation = null;
          state.notice = '';
          render();
        }
        if (event.target.id === 'market-sort') {
          state.marketSort = event.target.value;
          render();
        }
        if (event.target.id === 'palette') {
          choosePalette(event.target.value);
          render();
        }
        if (event.target.id === 'business-art') {
          businessArt = event.target.value;
          const url = new URL(location.href);
          url.searchParams.set('art', businessArt);
          history.replaceState(null, '', url);
          render();
        }
        if (event.target.id === 'scenario') {
          const tab = ['earn', 'businesses', 'markets', 'properties', 'wealth', 'profile'].includes(
            state.screen,
          )
            ? state.screen
            : 'earn';
          state = makeState(event.target.value);
          state.screen = tab;
          const url = new URL(location.href);
          url.searchParams.set('scenario', state.scenario);
          history.replaceState(null, '', url);
          render();
        }
        if (event.target.id === 'payout') {
          state.payout = Number(event.target.value);
          state.notice = 'Payout · ' + state.payout + '%';
          render();
        }
      });
      document.addEventListener('keydown', (event) => {
        if (event.target.closest('input,textarea,select,[contenteditable]')) return;
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          event.preventDefault();
          cycle(event.key === 'ArrowRight' ? 1 : -1);
        }
      });
      if (query.get('mode') === 'production') document.querySelector('.switcher').hidden = true;
      document.getElementById('palette').value = palette;
      document.getElementById('scenario').value = state.scenario;
      document.getElementById('business-art').value = businessArt;
      render();
    </script>
  </body>
</html>
